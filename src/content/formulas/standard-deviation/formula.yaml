id: standard-deviation
name: Standard Deviation
aliases: [SD, Sample standard deviation, Population standard deviation, Spread]
topic: mathematics/probability-and-statistics/descriptive-statistics
difficulty: basic
summary: How spread out data are around their mean. Sample (n − 1) and population (N) versions.

latex: |-
  \sym{s}{s} = \sqrt{\frac{1}{\sym{n}{n} - 1}\sum_{\sym{i}{i}=1}^{\sym{n}{n}} \left(\sym{x}{x}_{\sym{i}{i}} - \sym{xbar}{\bar{x}}\right)^2}, \qquad \sym{sigma}{\sigma} = \sqrt{\frac{1}{\sym{N}{N}}\sum_{\sym{i}{i}=1}^{\sym{N}{N}} \left(\sym{x}{x}_{\sym{i}{i}} - \sym{mu}{\mu}\right)^2}

variables:
  - id: s
    symbol: s
    name: Sample standard deviation
    unit: null
    description: Use when the data are a **sample** from a larger population. Divides by $n - 1$ (Bessel's correction).
    searchAliases: [sample standard deviation, sd, stdev]
  - id: sigma
    symbol: \sigma
    name: Population standard deviation
    unit: null
    description: Use when the data are the **entire population**. Divides by $N$.
    searchAliases: [population standard deviation, sigma, stdevp]
  - id: x
    symbol: x_i
    name: Data values
    unit: null
    shape: list
    description: The individual observations.
    searchAliases: [data, values]
  - id: xbar
    symbol: \bar{x}
    name: Sample mean
    unit: null
    inCalculator: false
    description: Mean of the sample.
  - id: mu
    symbol: \mu
    name: Population mean
    unit: null
    inCalculator: false
    description: Mean of the population. Numerically, the mean of the data.
  - id: n
    symbol: n
    name: Sample size
    unit: null
    kind: index
    description: Number of values in the sample.
  - id: N
    symbol: N
    name: Population size
    unit: null
    kind: index
    description: Number of values in the population.
  - id: i
    symbol: i
    name: Index

id: determinant-3x3
name: Determinant of a 3×3 Matrix
aliases: [3 by 3 determinant, Cofactor expansion, Rule of Sarrus]
topic: mathematics/linear-algebra/determinants
difficulty: intermediate
summary: Cofactor expansion of a 3×3 determinant along the first row; the signed volume scale factor.

latex: |-
  \sym{D}{\det}\begin{pmatrix} \sym{a}{a} & \sym{b}{b} & \sym{c}{c} \\ \sym{d}{d} & \sym{e}{e} & \sym{f}{f} \\ \sym{g}{g} & \sym{h}{h} & \sym{i}{i} \end{pmatrix} = \sym{a}{a}(\sym{e}{e}\sym{i}{i} - \sym{f}{f}\sym{h}{h}) - \sym{b}{b}(\sym{d}{d}\sym{i}{i} - \sym{f}{f}\sym{g}{g}) + \sym{c}{c}(\sym{d}{d}\sym{h}{h} - \sym{e}{e}\sym{g}{g})


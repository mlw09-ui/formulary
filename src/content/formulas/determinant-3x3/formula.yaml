assumptions:
  - A **square** 3×3 matrix with entries from a commutative number system (real or complex numbers).
  - The **signs alternate** $+,\,-,\,+$ along the first row. Forgetting the minus on the middle term is the most common error.
  - The rule of Sarrus (diagonal products) works **only** for 3×3 matrices. For larger matrices use cofactor expansion or row reduction.

intuition: >-
  The three columns of the matrix span a parallelepiped (a slanted box). The determinant is its volume, with a sign
  that says whether the map preserves or mirrors orientation. Expanding along the first row reduces the problem
  to three 2×2 determinants: each entry times the area of the "shadow" that is left when you delete its row and
  column. Equivalently, it is the scalar triple product of the rows, $\mathbf{r}_1\cdot(\mathbf{r}_2\times\mathbf{r}_3)$.

derivation:
  - note: Laplace (cofactor) expansion along row 1. Each entry multiplies the determinant of the 2×2 minor left after deleting its row and column, with signs $(-1)^{1+j}$.
    latex: \det A = a\begin{vmatrix} e & f \\ h & i\end{vmatrix} - b\begin{vmatrix} d & f \\ g & i\end{vmatrix} + c\begin{vmatrix} d & e \\ g & h\end{vmatrix}
  - note: Evaluate each 2×2 minor as $ad - bc$.
    latex: \det A = a(ei - fh) - b(di - fg) + c(dh - eg)

example:
  title: A 3×3 determinant
  problem: Compute the determinant of $\begin{pmatrix} 2 & -3 & 1 \\ 2 & 0 & -1 \\ 1 & 4 & 5 \end{pmatrix}$.
  given:
    a: 2
    b: -3
    c: 1
    d: 2
    e: 0
    f: -1
    g: 1
    h: 4
    i: 5
  solveFor: D
  expected:
    D: 49
  tolerance: 1.0e-12
  steps:
    - latex: \det = 2\big(0\cdot5 - (-1)\cdot4\big) - (-3)\big(2\cdot5 - (-1)\cdot1\big) + 1\big(2\cdot4 - 0\cdot1\big)
    - latex: = 2(4) + 3(11) + 1(8) = 8 + 33 + 8 = 49
    - note: 'Check with the rule of Sarrus: $(0 + 3 + 8) - (0 - 8 - 30) = 11 + 38 = 49$.'
  answer: $\det = 49$
  sources:
    - value: Matrix entries
      source: Illustrative choice. Exact result, checked two ways.


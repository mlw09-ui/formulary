id: wave-speed
name: Wave Speed Equation
aliases: [v = fλ, Wave equation (speed), Phase velocity]
topic: physics/waves-and-optics/wave-motion
difficulty: basic
summary: A wave's speed equals its frequency times its wavelength.

latex: |-
  \sym{v}{v} = \sym{f}{f}\,\sym{lambda}{\lambda}

variables:
  - id: v
    symbol: v
    name: Wave speed
    unit: m/s
    description: Speed at which the wave crests travel (phase velocity). Set by the medium.
    searchAliases: [speed, velocity, phase velocity]
  - id: f
    symbol: f
    name: Frequency
    unit: Hz
    description: Number of oscillations per second. Set by the source.
    searchAliases: [frequency, hertz]
  - id: lambda
    symbol: \lambda
    name: Wavelength
    unit: m
    description: Distance between successive crests.
    searchAliases: [wavelength, lambda]

assumptions:
  - A **periodic** wave with a well-defined frequency and wavelength.
  - $v$ is the **phase** velocity. In dispersive media (water waves, light in glass) it depends on frequency, and energy travels at the group velocity instead.
  - The medium is uniform. When a wave enters a new medium, $f$ stays the same and $\lambda$ changes with $v$.

intuition: >-
  In one period, a wave moves forward by one wavelength, so speed = wavelength ÷ period = wavelength ×
  frequency. The medium fixes the speed and the source fixes the frequency, so the wavelength adjusts
  to fit. This is why a note sounds the same pitch underwater but has a wavelength about four times longer
  there: sound travels about four times faster in water.

derivation:
  - note: A crest travels one wavelength $\lambda$ in one period $T$.
    latex: v = \frac{\lambda}{T}
  - note: The frequency is the inverse of the period.
    latex: f = \frac{1}{T} \quad\Rightarrow\quad v = f\lambda

example:
  title: Wavelength of concert A
  problem: Concert pitch A is 440 Hz. What is its wavelength in air at 20 °C?
  given:
    f: 440
    v: 343
  solveFor: lambda
  expected:
    lambda: 0.77954545
  tolerance: 1.0e-7
  steps:
    - latex: \lambda = \frac{v}{f} = \frac{343\ \text{m/s}}{440\ \text{Hz}} = 0.780\ \text{m}
    - note: In water ($v \approx 1480$ m/s) the same note has $\lambda = 3.36$ m, but the same frequency and pitch.
  answer: $\lambda \approx 0.78\ \text{m}$
  sources:
    - value: v = 343 m/s
      source: Speed of sound in dry air at 20 °C ($331.3\sqrt{1 + T/273.15}$ m/s), standard tables.
    - value: v ≈ 1480 m/s in water
      source: Fresh water at 20 °C, standard tables (1482 m/s).
    - value: f = 440 Hz
      source: ISO 16:1975 standard tuning frequency.

calculator:
  solvable: [v, f, lambda]

related: [doppler-effect, snells-law, photon-energy, de-broglie-wavelength]
tags: [wave, frequency, wavelength, sound, light, oscillation, period]

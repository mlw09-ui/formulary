assumptions:
  - Both vectors have the **same number of components** and are expressed in the same **orthonormal** basis. In skewed coordinates you need the metric.
  - Real vectors. For complex vectors, conjugate one of them, $\sum \bar{a}_i b_i$.
  - The angle form requires both vectors to be non-zero.

intuition: >-
  The dot product measures how much two vectors point the same way. Multiply the length of one by the length of the
  other's shadow (projection) onto it. Parallel vectors give the full product of their lengths, perpendicular
  vectors give zero, and opposite ones give a negative result. Physics uses it constantly: work is
  $\mathbf{F}\cdot\mathbf{d}$, power is $\mathbf{F}\cdot\mathbf{v}$, flux is $\mathbf{B}\cdot\mathbf{A}$. It is also
  the quickest test for perpendicularity.

derivation:
  - note: Apply the law of cosines to the triangle formed by $\mathbf{a}$, $\mathbf{b}$ and $\mathbf{a} - \mathbf{b}$.
    latex: \lVert\mathbf{a} - \mathbf{b}\rVert^2 = \lVert\mathbf{a}\rVert^2 + \lVert\mathbf{b}\rVert^2 - 2\lVert\mathbf{a}\rVert\lVert\mathbf{b}\rVert\cos\theta
  - note: Expand the left side in components.
    latex: \sum (a_i - b_i)^2 = \sum a_i^2 + \sum b_i^2 - 2\sum a_i b_i
  - note: Compare the two expressions.
    latex: \sum_i a_i b_i = \lVert\mathbf{a}\rVert\,\lVert\mathbf{b}\rVert\cos\theta

example:
  title: Dot product and angle of two 3D vectors
  problem: Find $\mathbf{a}\cdot\mathbf{b}$ and the angle between $\mathbf{a} = (1, 2, 3)$ and $\mathbf{b} = (4, -5, 6)$.
  given:
    a: [1, 2, 3]
    b: [4, -5, 6]
  solveFor: s
  expected:
    s: 12
  tolerance: 1.0e-12
  steps:
    - latex: \mathbf{a}\cdot\mathbf{b} = (1)(4) + (2)(-5) + (3)(6) = 4 - 10 + 18 = 12
    - latex: \lVert\mathbf{a}\rVert = \sqrt{14} = 3.742, \qquad \lVert\mathbf{b}\rVert = \sqrt{77} = 8.775
    - latex: \cos\theta = \frac{12}{3.742 \times 8.775} = 0.3655 \quad\Rightarrow\quad \theta = 68.56^\circ
  answer: $\mathbf{a}\cdot\mathbf{b} = 12$; the angle between them is about $68.6^\circ$.
  sources:
    - value: a = (1, 2, 3), b = (4, −5, 6)
      source: Illustrative choice. Exact result.


id: dot-product
name: Dot Product
aliases: [Scalar product, Inner product, Euclidean inner product]
topic: mathematics/linear-algebra/vector-products
difficulty: basic
summary: Multiplies two vectors into a scalar; equals the product of their lengths and the cosine of the angle between them.

latex: |-
  \sym{s}{\sym{a}{\mathbf{a}}\cdot\sym{b}{\mathbf{b}}} = \sum_{\sym{i}{i}=1}^{\sym{n}{n}} \sym{a}{a}_{\sym{i}{i}}\,\sym{b}{b}_{\sym{i}{i}} = \lVert\sym{a}{\mathbf{a}}\rVert\,\lVert\sym{b}{\mathbf{b}}\rVert\cos\sym{theta}{\theta}

